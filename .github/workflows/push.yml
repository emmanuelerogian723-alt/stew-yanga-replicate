name: Publish Stew Yanga to Replicate
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cog binary
        run: |
          curl -sL -o /usr/local/bin/cog https://github.com/replicate/cog/releases/latest/download/cog_Linux_x86_64
          chmod +x /usr/local/bin/cog
          cog --help > /dev/null && echo "cog binary OK"
      - name: Login to Replicate
        run: cog login --token-stdin <<< "$REPLICATE_API_TOKEN"
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      - name: Push model to Replicate
        run: cog push emmanuelerogian723-alt/stew-yanga
      - name: Done
        run: echo "LIVE at https://replicate.com/emmanuelerogian723-alt/stew-yanga"
